<!DOCTYPE html>
<html class="h-full bg-[#f8f9fc] text-slate-800 selection:bg-sky-500/20 selection:text-sky-900" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Calispec chatbot</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
    <link rel="shortcut icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" />
    <script>
      (function() {
        var blank = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E";
        var links = document.querySelectorAll("link[rel*='icon']");
        links.forEach(function(l) { l.href = blank; });
      })();
    </script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'surface': '#f8f9fc',
              'surface-card': '#ffffff',
              'surface-muted': '#f1f5f9',
              'brand-blue': '#0284c7',
              'brand-navy': '#0f172a',
              'brand-orange': '#f97316',
              calispec: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
                950: '#082f49',
              },
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              'headline-xl': ['Space Grotesk', 'sans-serif'],
              'body-md': ['Inter', 'sans-serif'],
              'label-sm': ['JetBrains Mono', 'monospace'],
            },
            boxShadow: {
              'subtle-elevated': '0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04)',
              'input-bar': '0 10px 30px -4px rgba(2, 132, 199, 0.12), 0 4px 16px -2px rgba(15, 23, 42, 0.08)',
              'glow-amber': '0 4px 14px 0 rgba(245, 158, 11, 0.39)',
              'cali-sm': '0 1px 3px rgba(2, 132, 199, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04)',
              'cali-primary': '0 10px 25px -3px rgba(2, 132, 199, 0.35), 0 4px 6px -4px rgba(2, 132, 199, 0.2)',
              'cali-drawer': '0 20px 40px -15px rgba(15, 23, 42, 0.15), 0 0 1px 1px rgba(2, 132, 199, 0.08)',
            }
          }
        }
      };
    </script>
    <style>
      @layer base {
        html, body {
          height: 100%;
          margin: 0;
          padding: 0;
          background-color: #f8fafc;
        }
      }
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      *::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
      }

      /* Calispec Blueprint Canvas */
      .calispec-blueprint-canvas {
        background-color: #f8fafc;
        background-image: 
          radial-gradient(circle at 50% 180px, rgba(14, 165, 233, 0.12) 0%, rgba(248, 250, 252, 0) 65%),
          linear-gradient(to right, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
        background-size: 100% 100%, 24px 24px, 24px 24px;
      }

      /* Calispec Blueprint Grid Pattern */
      .calispec-grid-pattern {
        background-size: 32px 32px;
        background-image: 
          linear-gradient(to right, rgba(2, 132, 199, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
      }

      /* Subtle technical blueprint / metrology grid */
      .tech-grid-pattern {
        background-size: 40px 40px;
        background-image: 
          linear-gradient(to right, rgba(2, 132, 199, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(2, 132, 199, 0.04) 1px, transparent 1px);
      }

      /* Central luminous aura and radial glow */
      .ambient-glow {
        background: radial-gradient(
          circle at 50% 45%,
          rgba(56, 189, 248, 0.16) 0%,
          rgba(2, 132, 199, 0.09) 32%,
          rgba(224, 242, 254, 0.04) 60%,
          transparent 75%
        );
      }

      /* Concentric metrology calibration radar/rings */
      .calibration-rings {
        background-image: radial-gradient(
          circle at 50% 50%,
          transparent 0,
          transparent 160px,
          rgba(2, 132, 199, 0.05) 161px,
          transparent 162px,
          transparent 310px,
          rgba(56, 189, 248, 0.06) 311px,
          transparent 312px,
          transparent 460px,
          rgba(2, 132, 199, 0.04) 461px,
          transparent 462px
        );
      }

      /* Floating luminous input box elevation and ambient glow */
      .glow-search-bar {
        border: 1.5px solid rgba(56, 189, 248, 0.55);
        box-shadow: 
          0 0 28px -2px rgba(2, 132, 199, 0.22),
          0 14px 34px -8px rgba(15, 23, 42, 0.07),
          inset 0 1px 2px rgba(255, 255, 255, 0.8);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      .glow-search-bar:focus-within {
        border-color: #0284c7;
        box-shadow: 
          0 0 35px 2px rgba(2, 132, 199, 0.35),
          0 20px 40px -10px rgba(2, 132, 199, 0.16),
          inset 0 1px 2px rgba(255, 255, 255, 0.9);
      }

      .glow-pulse-amber {
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.35);
        animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
      }
      @keyframes pulse-ring {
        0% {
          box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4);
        }
        70% {
          box-shadow: 0 0 0 7px rgba(245, 158, 11, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(245, 158, 11, 0);
        }
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] text-slate-800 antialiased h-screen flex flex-col justify-between overflow-hidden selection:bg-sky-100 selection:text-sky-900 relative">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
