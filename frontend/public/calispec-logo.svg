    <!-- SPEEDOMETER DIAL & NEEDLE (ORANGE) -->
    <g transform="translate(73, 72)">
      <!-- Arc ticks -->
      <path stroke="#E66000" stroke-width="2.5" stroke-linecap="round" fill="none" 
            d="M -30 -10 A 32 32 0 0 1 10 -30" />
      <line x1="-28" y1="-12" x2="-23" y2="-10" stroke="#E66000" stroke-width="2.5" />
      <line x1="-18" y1="-24" x2="-15" y2="-19" stroke="#E66000" stroke-width="2.5" />
      <line x1="-2" y1="-30" x2="-2" y2="-24" stroke="#E66000" stroke-width="2.5" />
      <line x1="12" y1="-27" x2="9" y2="-22" stroke="#E66000" stroke-width="2.5" />
      
      <!-- Needle -->
      <polygon points="0,2 -24,-14 -18,-20" fill="#E66000" />
    </g>

    <!-- CALISPEC TEXT -->
    <text x="125" y="82" font-family="'Inter', 'Space Grotesk', -apple-system, sans-serif" font-weight="400" font-size="52" fill="#0072CE" letter-spacing="1.5">CALISPEC</text>
    <text x="396" y="48" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#0072CE">TM</text>

